<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Вещи и судьбы — игра по роману «Я исповедуюсь»</title>
<style>
:root{--ink:#24251f;--muted:#77786f;--paper:#f6f2e9;--card:#fffdf8;--accent:#765b43;--line:#e6dfd2;--green:#28734d;--red:#a33c36}
*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.5 Georgia,'Times New Roman',serif;min-height:100vh;display:grid;place-items:center;padding:20px}.app{width:min(100%,620px)}
.top{display:flex;justify-content:space-between;gap:12px;color:var(--muted);font:13px Arial,sans-serif;margin:0 2px 12px}.track{height:5px;background:var(--line);border-radius:9px;overflow:hidden;margin-bottom:18px}.fill{height:100%;background:var(--accent);width:0;transition:width .2s}
.panel{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:clamp(22px,5vw,38px);box-shadow:0 12px 35px #51452a0c}.eyebrow{text-transform:uppercase;letter-spacing:.16em;font:11px Arial,sans-serif;color:var(--muted);text-align:center}.title{text-align:center;font-size:clamp(28px,7vw,40px);font-weight:normal;line-height:1.15;margin:10px 0 18px}.object-art{display:block;width:min(100%,260px);height:150px;margin:0 auto 18px;border-radius:14px;background:linear-gradient(135deg,#f4efe5,#ebe3d5);border:1px solid var(--line)}.object-art img{width:100%;height:100%;display:block;object-fit:cover;border-radius:13px}.question{text-align:center;font-size:18px;margin:0 auto 24px;max-width:470px}.options{display:grid;gap:10px}.option{width:100%;text-align:left;padding:15px 17px;border:1px solid var(--line);border-radius:11px;background:#fffefa;color:var(--ink);font:16px Georgia,serif;cursor:pointer}.option:hover:not(:disabled){border-color:var(--accent);background:#f8f3eb}.option:disabled{cursor:default;opacity:.78}.option.selected{border-color:var(--red);background:#f9eeec}.option.correct{border-color:var(--green);background:#edf5ef}
.feedback{margin-top:20px;padding:17px;border-radius:11px;background:#f5f1e9;border-left:4px solid var(--muted)}.feedback.good{border-left-color:var(--green)}.feedback.bad{border-left-color:var(--red)}.feedback h3{font:bold 17px Arial,sans-serif;margin:0 0 7px}.feedback.good h3{color:var(--green)}.feedback.bad h3{color:var(--red)}.feedback p{margin:0;font-size:16px}.actions{display:flex;justify-content:center;margin-top:20px}.primary{border:0;border-radius:999px;background:var(--accent);color:white;padding:13px 27px;font:14px Arial,sans-serif;cursor:pointer}.primary:hover{filter:brightness(1.08)}.hint{text-align:center;color:var(--muted);font:12px Arial,sans-serif;margin-top:17px}.hidden{display:none!important}.result{text-align:center}.score{font-size:54px;color:var(--accent);margin:12px 0}.result p{font-size:17px}.start{text-align:center}.start p{max-width:430px;margin:0 auto 25px;font-size:18px}
@media(max-width:480px){body{padding:12px}.panel{border-radius:14px;padding:24px 18px}.option{padding:16px}.question{font-size:17px}}
</style>
</head>

<main class="app">
 <div class="top"><span id="progressText">Готовы начать?</span><span id="scoreText">Найдено: 0</span></div>

 <section class="panel start" id="startScreen"><div class="eyebrow">Игра по роману Жауме Кабре</div><h1 class="title">Вещи и судьбы</h1><p class="question">У каждого предмета своя история. Определите, для кого он имел самое большое значение — и чья судьба оказалась с ним связана.</p><div class="actions"><button class="primary" id="startBtn" type="button">Начать игру</button></div></section>
 <section class="panel hidden" id="gameScreen"><div class="eyebrow" id="cardNumber"></div><h1 class="title" id="objectTitle"></h1><div class="object-art" id="objectImage" role="img" aria-label="Иллюстрация предмета"></div><p class="question" id="questionText"></p><div class="options" id="options"></div><div class="feedback hidden" id="feedback" aria-live="polite"><h3 id="feedbackTitle"></h3><p id="feedbackText"></p></div><div class="actions"><button class="primary hidden" id="nextBtn" type="button">Следующий предмет</button></div><div class="hint" id="hint">Выберите одного из трёх персонажей.</div></section>

const el=id=>document.getElementById(id);
function shuffle(items){const a=items.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function begin(){current=0;score=0;shuffledOptions=cards.map(card=>shuffle(card.options));el('startScreen').classList.add('hidden');el('resultScreen').classList.add('hidden');el('gameScreen').classList.remove('hidden');renderCard();}
function renderCard(){locked=false;const card=cards[current];el('progressText').textContent=`Карточка ${current+1} из ${cards.length}`;el('scoreText').textContent=`Найдено: ${score}`;el('progress').style.width=`${current/cards.length*100}%`;el('cardNumber').textContent=`Предмет ${current+1}`;el('objectTitle').textContent=card.object;el('objectImage').innerHTML=`<img src="${illustrations[card.art]}" alt="${card.object}">`;el('questionText').textContent=card.question;el('feedback').className='feedback hidden';el('feedbackTitle').textContent='';el('feedbackText').textContent='';el('nextBtn').classList.add('hidden');el('hint').textContent='Выберите одного из трёх персонажей.';const list=el('options');list.replaceChildren();shuffledOptions[current].forEach(option=>{const button=document.createElement('button');button.type='button';button.className='option';button.textContent=option.name;button.addEventListener('click',()=>selectAnswer(option,button));list.appendChild(button);});}
function selectAnswer(option,button){if(locked||button.disabled)return;locked=true;const feedback=el('feedback');feedback.className='feedback';el('feedbackTitle').textContent=option.correct?'Ответ верный':'Ответ неверный';el('feedbackText').textContent=option.explanation;if(option.correct){score++;feedback.classList.add('good');button.classList.add('correct');}else{feedback.classList.add('bad');button.classList.add('selected');}Array.from(el('options').children).forEach(b=>b.disabled=true);el('scoreText').textContent=`Найдено: ${score}`;el('nextBtn').textContent=current===cards.length-1?'К результатам':'Следующий вопрос';el('nextBtn').classList.remove('hidden');el('hint').textContent='Перейдите к следующему вопросу.';}
function advance(){current++;if(current<cards.length){renderCard();}else{showResults();}}
function showResults(){el('gameScreen').classList.add('hidden');el('resultScreen').classList.remove('hidden');el('progressText').textContent='Игра завершена';el('scoreText').textContent=`Найдено: ${score}`;el('progress').style.width='100%';el('finalScore').textContent=`${score} / ${cards.length}`;el('resultText').textContent=score===4?'Прекрасно! Вы нашли все четыре верных ответа.':score>=2?'Хороший результат! Вы верно определили судьбы нескольких персонажей.':'Каждая попытка помогает лучше разобраться в историях героев. Попробуйте ещё раз!';}
el('startBtn').addEventListener('click',begin);el('restartBtn').addEventListener('click',begin);el('nextBtn').addEventListener('click',advance);
</script>
